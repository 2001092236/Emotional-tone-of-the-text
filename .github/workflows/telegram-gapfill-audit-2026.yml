name: Разовая дозагрузка Telegram и аудит корпуса 2026
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-gapfill-audit-2026.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mgimo-telegram-audit-2026
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Старт аудита и дозагрузки 2026')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Проверить качество кода и фильтр 2026 года
        run: python -m pytest -q
      - name: Дозагрузить недостающую раннюю историю Telegram Зеленского
        id: extend
        continue-on-error: true
        run: python -m corpus2026.telegram_extend --leader zelenskyy --until 2026-11-07 --max-pages 360 --delay 0.6
      - name: Пересобрать статические данные без удаления тематических моделей
        run: python -m corpus2026.cli build-site
      - name: Провести офлайн-аудит полноты и атрибуции
        run: |
          python -m corpus2026.audit --until 2026-11-07 --out data/2026/audit_report.json
          cp data/2026/audit_report.json docs/data/audit.json
      - name: Зафиксировать результат в репозитории
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/2026 docs/data
          if ! git diff --cached --quiet; then
            git commit -m 'Данные: продолжение истории Telegram и аудит корпуса 2026'
            git push origin 'HEAD:main'
          fi
      - name: Показать статус выборки
        run: |
          echo 'Историческая выборка 2026: аудит записан в data/2026/audit_report.json' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.extend.outcome }}" != 'success' ]; then
            echo 'Telegram-дозагрузка ограничена или прервана; частичный результат сохранён, см. telegram_extend_report.json.' >> "$GITHUB_STEP_SUMMARY"
          fi
