name: Проверка официальных архивов — 2026 (без зеркал)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/official-source-probe-2026.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mgimo-source-probe-2026
  cancel-in-progress: false
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Проверка официальных источников 2026')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Проверить ограничения и редиректы
        run: python -m pytest -q tests/test_official_probe.py
      - name: Проверить HTTP и robots.txt у кандидатов
        run: python -m corpus2026.official_probe --out data/2026/official_source_probe.json
      - name: Зафиксировать только метаданные доступности
        run: |
          cp data/2026/official_source_probe.json docs/data/official_source_probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/2026/official_source_probe.json docs/data/official_source_probe.json
          if ! git diff --cached --quiet; then
            git commit -m 'Данные: статус доступа к официальным архивам 2026'
            git push origin 'HEAD:main'
          fi
