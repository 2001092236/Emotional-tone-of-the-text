name: Исследование тем — 3 HF GPU-энкодера (только вручную)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu-research:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - name: Verify real CUDA and software versions
        run: |
          nvidia-smi
          python - <<'PY'
          import torch
          assert torch.cuda.is_available(), "GPU-labelled runner must have working CUDA"
          print("GPU:", torch.cuda.get_device_name(0), "CUDA:", torch.version.cuda)
          PY
      - name: Install topic modelling libraries and morphology
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-analysis.txt
          python -m pip install "spacy>=3.8,<3.9" "gensim>=4.3,<5" bitermplus \
            "transformers>=4.51" "sentence-transformers>=4.1" \
            "bertopic>=0.16" "umap-learn>=0.5" "hdbscan>=0.8" \
            "contextualized-topic-models>=2.5" "top2vec>=1.0" "pytest>=8,<10"
          python -m spacy download en_core_web_sm
          python -m spacy download ru_core_news_sm
          python -m spacy download uk_core_news_sm
      - name: Audit software and training environment
        run: |
          mkdir -p gpu-artifacts
          git rev-parse HEAD > gpu-artifacts/git_sha.txt
          python -m pip freeze > gpu-artifacts/pip_freeze.txt
          nvidia-smi > gpu-artifacts/gpu_info.txt
      - name: Test pipelines
        run: |
          python -m py_compile corpus2026/topic_lab.py corpus2026/topic_review.py
          python -m pytest -q tests/test_topic_lab.py tests/test_itar.py
      - name: Full research sweep with real Hugging Face GPU encoders
        run: |
          python -m corpus2026.topic_lab --mode full --max-docs 1400 \
            --cache-dir .cache/topic_lab --out gpu-artifacts/topic_lab_full_2026.json
      - name: Verify at least 20 successful trials and 7 algorithms and 3 GPU encoders
        run: |
          python - <<'PY'
          import json
          r=json.load(open('gpu-artifacts/topic_lab_full_2026.json',encoding='utf8'))
          for leader,v in r['leaders'].items():
              print(leader,v['completed_trials'],v['completed_algorithms'],v['completed_gpu_encoders'])
              assert v['completed_trials']>=20, leader
              assert len(v['completed_algorithms'])>=7, leader
              assert len(v['completed_gpu_encoders'])>=3, leader
          PY
      - name: Offline document-grounded LLM review (if local vLLM exists)
        run: |
          python - <<'PY'
          import urllib.request
          import subprocess
          try:
              with urllib.request.urlopen('http://127.0.0.1:8000/v1/models',timeout=3) as response:
                  assert response.status==200
          except Exception:
              print('No localhost LLM: benchmark remains semantically unapproved')
          else:
              subprocess.check_call(['python','-m','corpus2026.topic_review',
                  '--benchmark','gpu-artifacts/topic_lab_full_2026.json',
                  '--out','gpu-artifacts/topic_lab_reviewed_2026.json'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topic-research-2026
          path: gpu-artifacts/
          retention-days: 30
