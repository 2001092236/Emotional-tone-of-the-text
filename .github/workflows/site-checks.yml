name: Проверка интерфейса — русский исследовательский сайт
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/test_lexical.js'
      - '.github/workflows/site-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверить синтаксис интерфейса
        run: |
          node --check docs/app.js
          node --check docs/lexical-shift.js
          node --check docs/audit.js
          node --check docs/official-speeches.js
          node --check docs/official-speeches.js
          node --check docs/itar.js
      - name: Проверить лексическую статистику на контрольных данных
        run: node tests/test_lexical.js
      - name: Проверить базовые файлы и вкладки
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('docs/index.html','utf8');
          for (const id of ['view-overview','view-themes','view-documents','lexicalResult']) {
            if (!html.includes('id="'+id+'"')) throw Error('Нет раздела '+id);
          }
          for (const p of ['docs/assets/mark.svg','docs/data/summary.json','docs/method.html','docs/audit.html','docs/audit.js','docs/official-speeches.html','docs/itar.html']) {
            if (!fs.existsSync(p)) throw Error('Нет файла '+p);
          }
          console.log('Интерфейс: структурные проверки пройдены');
          NODE
