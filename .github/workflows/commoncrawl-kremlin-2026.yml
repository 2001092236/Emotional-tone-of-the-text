name: "Проверка публичного архива Common Crawl: Кремль 2026"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/commoncrawl-kremlin-2026.yml']
permissions:
  contents: write
concurrency:
  group: mgimo-commoncrawl-probe-2026
  cancel-in-progress: false
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Пилот CC 2026')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Проверить допустимые адреса и форматы
        run: python -m pytest -q tests/test_commoncrawl_probe.py
      - name: Проверить индексы 2026 без загрузки стенограмм
        run: python -m corpus2026.commoncrawl_probe
      - name: Сохранить проверяемый отчёт
        run: |
          cp data/2026/cc_kremlin_probe.json docs/data/cc_kremlin_probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/2026/cc_kremlin_probe.json docs/data/cc_kremlin_probe.json
          if ! git diff --cached --quiet; then
            git commit -m 'Данные: доступность архивов стенограмм в Common Crawl 2026'
            git push origin 'HEAD:main'
          fi
