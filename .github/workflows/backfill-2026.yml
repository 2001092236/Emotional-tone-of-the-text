name: Историческая выгрузка корпуса 2026
on:
  push:
    branches: [main]
    paths: ['.github/workflows/backfill-2026.yml'] # One-time bootstrap when this file is published; no cron
  workflow_dispatch:
    inputs:
      source:
        description: Кого загружать
        required: true
        type: choice
        default: all
        options: [all, trump, putin, zelenskyy]
      max_pages:
        description: Число архивных страниц (110 полный проход; 2 тест)
        required: true
        default: '110'
        type: string
permissions:
  contents: write
concurrency:
  group: mgimo-historical-backfill-2026
  cancel-in-progress: false
jobs:
  backfill:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Bootstrap 2026 history')
    name: Исторический сбор
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run offline parsing and year-guard tests
        run: pytest -q
      - name: Load historical 2026 texts (no scheduling)
        id: collect
        continue-on-error: true
        env:
          SOURCE: ${{ inputs.source || 'all' }}
          MAX_PAGES: ${{ inputs.max_pages || '110' }}
        run: python -m corpus2026.cli backfill --source "$SOURCE" --since 2026-01-01 --until "$(date -u +%F)" --max-pages "$MAX_PAGES"
      - name: Validate generated dataset
        run: |
          python -m corpus2026.cli build-site
          python -m compileall -q corpus2026
      - name: Commit 2026 corpus and generated static data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/2026 docs/data
          if ! git diff --cached --quiet; then
            git commit -m 'data: historical 2026 backfill (${{ inputs.source || 'all' }})'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Warn if any source was partial or inaccessible
        if: steps.collect.outcome != 'success'
        run: |
          echo 'At least one source had incomplete/blocked access. See data/2026/run_report.json.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
